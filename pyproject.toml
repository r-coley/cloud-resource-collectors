[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-resource-collectors"
version = "0.3.0"
description = "Cross-cloud resource inventory and Neo4j resilience evidence queries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35,<2", "azure-identity>=1.19,<2", "azure-mgmt-resourcegraph>=8,<9",
  "google-api-python-client>=2.150,<3", "google-auth>=2.35,<3",
  "neo4j>=5.26,<7", "jsonschema>=4.23,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "ruff>=0.14,<1"]

[project.scripts]
cloud-collect = "cloud_resource_collectors.cli:collect_main"
cloud-graph = "cloud_resource_collectors.cli:graph_main"
cloud-demo = "cloud_resource_collectors.demo:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
cloud_resource_collectors = ["data/*.json", "queries/*.cypher"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["python_tests"]
